{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="{% static 'gallery/style.css' %}">
    <meta charset="UTF-8">
    <title>Загрузка модели</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        .form-group { margin-bottom: 1rem; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="upload-page">
        <h1>Загрузить новую 3D модель</h1>
        
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                {{ form.as_p }}
            </div>

            <div style="margin-bottom: 20px;">
                <p>Превью:</p>
                <div id="preview-container">
                    <span>⌛</span>
                </div>
                <input type="hidden" name="image_data" id="id_image_data">
            </div>
            
            <button type="submit" id="submit-btn" disabled>Загрузить в базу</button>
        </form>
        
        <br>
        <a href="{% url 'home' %}" style="color: #666; text-decoration: none;">← Назад в галерею</a>
    </div>

    <!-- Остальные скрипты (importmap, autothumb.js) остаются как были -->
    {% load static %}
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="{% static 'gallery/js/autothumb.js' %}"></script>
</body>
</html>
